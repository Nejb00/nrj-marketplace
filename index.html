<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRJ Marketplace - Grossiste</title>
  <link rel="icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="description" content="NRJ Marketplace - Grossiste en Chine, France, Turquie → Congo Brazzaville">
</head>
<body>
  <div id="headerSpacer"></div>
  <div id="headerWrapper" class="header-wrapper">
    <header>
      <div class="logo-wrapper" id="backToHomeBtn" role="button" tabindex="0">
        <div class="logo-icon"></div>
        <div class="logo-brand">
          <div class="logo-text">NRJ Marketplace</div>
          <div class="logo-subtext">Grossiste</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Changer le thème"></button>
      </div>
    </header>

    <div class="search-bar-container">
      <div class="search-bar">
        <div class="search-icon"></div>
        <input type="text" id="searchInput" placeholder="Rechercher un produit..." autocomplete="off">
        <button class="search-voice" id="voiceSearchBtn" aria-label="Recherche vocale">🎤</button>
      </div>
      <div id="searchDropdown" class="search-dropdown" style="display: none;"></div>
    </div>

    <div class="discovery">
      <div class="discovery-section">
        <div class="discovery-chips" id="discoveryChips"></div>
      </div>
    </div>
  </div>

  <div id="catalogueWrapper">
    <div class="products-section">
      <div class="filter-chips" id="quickFilters">
        <button class="filter-chip active" data-filter="all">Tout</button>
        <button class="filter-chip" data-filter="new">✨ Nouveautés</button>
        <button class="filter-chip" data-filter="popular">🔥 Populaires</button>
      </div>
      <div class="filter-bar" id="filterBar"></div>
      <div class="products-grid" id="productsGrid"></div>
    </div>
  </div>

  <div id="searchView" style="display: none;"></div>

  <div id="categoriesView" style="display: none;">
    <div class="categories-section">
      <div class="categories-grid" id="categoriesGrid"></div>
    </div>
  </div>

  <div id="accountView">
    <div class="account-header">
      <button class="account-back" data-account-action="close" aria-label="Retour">←</button>
      <div class="account-identity">
        <div class="account-avatar"></div>
        <div class="account-greet">
          <div class="account-greet-hello"></div>
          <div class="account-greet-sub">Voici votre espace NRJ</div>
        </div>
      </div>
    </div>
    <div class="account-stats"></div>
    <div id="accountContent"></div>
  </div>

  <div class="product-modal" id="productModal">
    <div class="modal-image-section">
      <button class="back-arrow-btn" id="modalCloseBtn" aria-label="Retour"></button>
      <div class="product-id-badge" id="modalProductIdBadge"></div>
      <div class="product-actions-overlay">
        <button class="action-circle" id="modalFavBtn" aria-label="Ajouter aux favoris">
          <svg viewBox="0 0 24 24" class="fav-icon-svg">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </button>
        <button class="action-circle" id="modalShareBtn" aria-label="Partager"></button>
      </div>
      <div class="carousel-scroll" id="modalCarouselScroll"></div>
      <div class="carousel-dots" id="modalCarouselDots"></div>
      <div class="modal-badges" id="modalBadges"></div>
    </div>
    <div class="product-details">
      <div class="product-detail-price" id="modalPrice"></div>
      <div class="product-detail-moq" id="modalMoq"></div>
      <div class="product-detail-total" id="modalTotal"></div>
      <div class="product-detail-desc" id="modalDesc"></div>
      
      <div class="option-group" id="modalTailleGroup">
        <label>Taille</label>
        <div class="option-buttons" id="modalTailleOptions"></div>
      </div>
      
      <div class="option-group" id="modalCouleurGroup">
        <label>Couleur</label>
        <div class="option-buttons" id="modalCouleurOptions"></div>
      </div>
    </div>
    
    <div class="recommendations">
      <h3>Vous aimerez aussi</h3>
      <div class="rec-carousel" id="modalRecCarousel"></div>
    </div>
    
    <div class="sourcing-section">
      <h3>Vous ne trouvez pas votre bonheur ?</h3>
      <p>Envoyez-nous une photo ou décrivez votre recherche.</p>
      <button class="sourcing-btn" id="modalSourcingBtn">📸 Photo</button>
      <button class="whatsapp-btn" id="modalDescSourcingBtn">💬 Message</button>
    </div>
  </div>

  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <h3>Panier</h3>
      <button class="cart-close" id="cartCloseBtn">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">Total : <span id="cartTotal">XAF 0</span></div>
      <button class="checkout-btn" id="checkoutBtn">Commander</button>
    </div>
  </div>
  <div class="cart-overlay" id="cartOverlay"></div>

  <div class="order-modal" id="orderModalOverlay">
    <div class="order-content">
      <h3>Finaliser la commande</h3>
      <div id="orderSummary"></div>
      <input type="text" id="customerName" placeholder="Votre nom">
      <button class="send-btn" id="sendWhatsAppBtn">📤 Envoyer sur WhatsApp</button>
      <button class="cancel-btn" id="cancelOrderBtn">Annuler</button>
    </div>
  </div>

  <div class="edit-modal" id="editProductModalOverlay">
    <div class="edit-content">
      <h3>Modifier le produit</h3>
      <input type="hidden" id="editProductId">
      <input type="text" id="editName" placeholder="Nom">
      <input type="text" id="editCategory" placeholder="Catégorie">
      <input type="number" id="editPrice" placeholder="Prix">
      <input type="text" id="editImage" placeholder="Image URL">
      <input type="text" id="editImage2" placeholder="Image 2 URL">
      <input type="text" id="editImage3" placeholder="Image 3 URL">
      <input type="text" id="editImage4" placeholder="Image 4 URL">
      <input type="text" id="editImage5" placeholder="Image 5 URL">
      <input type="text" id="editImage6" placeholder="Image 6 URL">
      <input type="text" id="editTailles" placeholder="Tailles (S, M, L)">
      <input type="text" id="editCouleurs" placeholder="Couleurs">
      <input type="number" id="editMoq" placeholder="MOQ" value="1">
      <textarea id="editDesc" placeholder="Description"></textarea>
      <div id="editError" style="color: #fca5a5; font-size: 0.85rem;"></div>
      <button class="save-btn" id="saveEditBtn">💾 Enregistrer</button>
      <button class="cancel-btn" id="cancelEditBtn">Annuler</button>
    </div>
  </div>

  <nav class="main-nav" id="mainNav">
    <div class="nav-item" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </div>
    <div class="nav-item" data-nav="categories">
      <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
    </div>
    <div class="nav-item" data-nav="cart">
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <span class="cart-badge" id="navCartBadge" style="display: none;">0</span>
    </div>
    <div class="nav-item" data-nav="favorites">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span class="favorites-badge" id="navFavBadge" style="display: none;">0</span>
    </div>
    <div class="nav-item" data-nav="profile">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </div>
  </nav>

  <div class="toast" id="toast"></div>

  <script type="module" src="/src/js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
