<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="NRJ Marketplace - Importation de produits depuis la Chine, la France et la Turquie vers le Congo Brazzaville.">
    <link rel="icon" href="/icon.svg">
    <title>NRJ Marketplace • Import Chine, France, Turquie → Congo</title>
    <meta name="theme-color" content="#0f0f0f">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NRJ">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png">
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(() => {
            if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
          });
        });
      }
    </script>
    <link rel="preconnect" href="https://peojyqliwrtghomyukwn.supabase.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://wsrv.nl" crossorigin>
</head>
<body>
    <div id="catalogueWrapper">
        <div class="header-fixed" id="headerFixed">
            <!-- Couche 1 : barre de recherche PLEINE LARGEUR, toujours visible (façon Temu) -->
            <div class="search-bubble-full" id="searchFull">
                <div class="search-bar-container">
                    <button type="button" class="tap-to-search" id="tapToSearch" aria-label="Rechercher un produit">
                        <span class="search-icon" aria-hidden="true"></span>
                        <span class="search-tap-placeholder" id="searchTapPlaceholder">Rechercher un produit...</span>
                    </button>
                    <input type="search" id="searchInput" placeholder="Rechercher un produit..." autocomplete="off" enterkeyhint="search" hidden>
                    <button class="search-clear" id="searchClear" aria-label="Effacer" style="display:none;">&times;</button>
                    <button class="search-camera" id="searchCamera" aria-label="Recherche par photo" title="Recherche par photo">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 3 7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0-10 5 5 0 0 1 0-10 5 5 0 0 1 0-10 5 5 0 0 1 0-10z"></path></svg>
                    </button>
                    <button class="search-go" id="searchGo" aria-label="Lancer la recherche">
                        <svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35"></path><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"></circle></svg>
                    </button>
                </div>
            </div>
            <div class="filters-bar header-category-row" id="filterBar"></div>
            <div class="subcategory-bubbles" id="subcategoryBubbles" hidden></div>
        </div>
        <div id="headerSpacer"></div>
        <main id="mainContent">
            <section class="hero-section" id="homeSection">
                <div class="hero-banner" id="heroBanner"></div>
                <div class="products-grid" id="productsGrid" role="list"></div>
                <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
                    <button class="load-more-btn" id="loadMoreBtn">Charger plus</button>
                </div>
            </section>
            <div class="categories-view" id="categoriesView" style="display:none;">
                <div class="categories-page-header">
                    <h2 class="categories-page-title">Nos Catégories</h2>
                    <button type="button" id="backToHomeBtn" class="categories-back-btn" aria-label="Retour">← Retour</button>
                </div>
                <div class="categories-layout">
                    <aside class="categories-sidebar" id="categoriesSidebar" aria-label="Catégories parentes"></aside>
                    <div class="categories-main">
                        <div class="categories-panel" id="categoriesPanel" aria-label="Sous-catégories"></div>
                        <section class="categories-popular" aria-label="Articles populaires">
                            <div class="categories-popular-toolbar">
                                <h3 class="categories-popular-title">Articles populaires</h3>
                                <label class="categories-sort-label">
                                    <span class="categories-sort-text">Trier par</span>
                                    <select id="categoriesSortSelect" class="categories-sort-select" aria-label="Trier par">
                                        <option value="relevance" selected>Pertinence</option>
                                        <option value="bestsellers">Meilleures ventes</option>
                                        <option value="newest">Plus récents</option>
                                        <option value="price-asc">Prix croissant</option>
                                        <option value="price-desc">Prix décroissant</option>
                                        <option value="foryou">✨ Pour toi</option>
                                    </select>
                                </label>
                            </div>
                            <div class="products-grid categories-popular-grid" id="categoriesPopularGrid" role="list"></div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
        <nav class="main-nav">
            <a href="#" class="nav-item active" data-nav="home" aria-label="Accueil"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg></a>
            <a href="#" class="nav-item categories-accent" data-nav="categories" aria-label="Catégories"><svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86 1-1.41-.36-.37-.86-.59-1.41-.59H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.89-2-1.99-2z"></path></svg></a>
            <a href="#" class="nav-item cart-accent" data-nav="cart" aria-label="Panier"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.89-2-1.99-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 1.99.9 1.99 2-.89 2-1.99-2z"></path></svg><span class="cart-badge" id="navCartBadge" style="display:none;">0</span></a>
            <a href="#" class="nav-item favorites-accent" data-nav="favorites" aria-label="Favoris"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg><span class="favorites-badge" id="navFavBadge" style="display:none;">0</span></a>
            <a href="#" class="nav-item" data-nav="profile" aria-label="Mon NRJ"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg></a>
        </nav>
        <footer><p>© 2026 NRJ Marketplace — Chine • France • Turquie → Congo Brazzaville 🔥</p></footer>
    </div>
</body>
</html>
