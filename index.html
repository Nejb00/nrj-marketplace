<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="FLUO - Importation de produits depuis la Chine, la France et la Turquie vers le Congo Brazzaville.">
    <link rel="icon" href="/icon.svg">
    <title>FLUO • Import Chine, France, Turquie → Congo</title>
    <meta name="theme-color" content="#0f0f0f">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FLUO">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(() => {
            if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
          });
        });
      }
    </script>
    <link rel="preconnect" href="https://peojyqliwrtghomyukwn.supabase.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://wsrv.nl" crossorigin>
</head>
<body>
    <div id="catalogueWrapper">
        <div class="header-fixed" id="headerFixed">
            <div class="header-top-row">
                <div class="logo-bubble" id="logoBubble" onclick="location.href='/" role="button" aria-label="Accueil FLUO">
                    <span class="logo-icon" id="logoIcon" aria-hidden="true"></span>
                    <span class="logo-brand-text">FLUO</span>
                </div>
                <button class="search-bubble-compact" id="searchCompact" aria-label="Rechercher">
                    <span class="search-icon" aria-hidden="true"></span>
                </button>
                <div class="actions-bubble" id="actionsBubble">
                    <button class="action-btn" id="catalogBtnHeader" aria-label="Catégories" title="Catégories">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z"></path></svg>
                    </button>
                    <button class="action-btn" id="profileBtnHeader" aria-label="Mon FLUO" title="Mon FLUO">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
                    </button>
                    <button class="action-btn cart-btn" id="cartBtnHeader" aria-label="Panier" title="Panier">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"></path></svg>
                        <span class="header-cart-badge" id="headerCartBadge" style="display:none;">0</span>
                    </button>
                </div>
            </div>
            <div class="search-bubble-full" id="searchFull">
                <div class="search-bar-container">
                    <div class="search-bar">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="Rechercher un produit..." autocomplete="off" aria-label="Rechercher un produit">
                        <button class="search-voice" id="searchVoice" aria-label="Recherche vocale" title="Recherche vocale">
                            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.7 5.1 5 5.1s5-2.1 5-5.1h-1.7z"></path></svg>
                        </button>
                        <div class="search-loader" id="searchLoader" style="display:none;"></div>
                        <button class="search-clear" id="searchClear" style="display:none;" aria-label="Effacer">✕</button>
                    </div>
                    <div class="search-dropdown" id="searchDropdown" style="display:none;"></div>
                </div>
            </div>
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" data-category="all">Tout</button>
            </div>
        </div>
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Changer de thème" title="Basculer thème clair/sombre" style="display:none;">🌙</button>
        <button class="logout-btn" id="logoutBtn" aria-label="Se déconnecter" title="Se déconnecter" style="display:none;">🚪</button>
        <div id="headerSpacer"></div>
        <div id="catalogueView">
            <div class="subcategory-bubbles" id="subcategoryBubbles" hidden data-no-catalog-swipe></div>
            <div class="quick-filters">
                <button class="filter-chip active" data-filter="all">Tout</button>
                <button class="filter-chip" data-filter="new">✨ Nouveautés</button>
                <button class="filter-chip" data-filter="bestseller">🔥 Populaires</button>
            </div>
            <section class="products-section" aria-live="polite">
                <div class="products-grid" id="productsGrid" role="list"></div>
            </section>
            <div id="loadMoreSentinel" style="height: 20px;"></div>
            <p id="loadingMessage" style="text-align:center;color:var(--text-secondary);display:none;">⏳ Chargement des produits...</p>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="product-modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="modalProductName">
        <div class="product-modal-header">
            <button class="modal-back-btn" id="modalCloseBtn" aria-label="Fermer">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg>
            </button>
            <div class="modal-header-actions">
                <button class="modal-action-btn" id="modalShareBtn" aria-label="Partager">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"></path></svg>
                </button>
                <button class="modal-action-btn fav-btn" id="modalFavBtn" aria-label="Favoris">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
                </button>
            </div>
        </div>
        <div class="product-modal-body">
            <div class="product-media">
                <div class="carousel" id="modalCarousel">
                    <div class="carousel-track" id="modalCarouselTrack"></div>
                    <div class="carousel-dots" id="modalCarouselDots"></div>
                </div>
            </div>
            <div class="product-details">
                <div class="product-badges" id="modalBadges"></div>
                <h1 class="product-name" id="modalProductName"></h1>
                <div class="product-price-row">
                    <span class="product-price" id="modalPrice"></span>
                    <span class="product-moq" id="modalMoq"></span>
                </div>
                <p class="product-desc" id="modalDesc"></p>
                <div class="option-group" id="modalTailleGroup" style="display:none;">
                    <label class="option-label" id="modalTailleLabel">Taille</label>
                    <div class="option-buttons" id="modalTailleOptions"></div>
                </div>
                <div class="option-group" id="modalCouleurGroup" style="display:none;">
                    <label class="option-label" id="modalCouleurLabel">Couleur</label>
                    <div class="option-buttons color-swatches" id="modalCouleurOptions"></div>
                </div>
                <div class="option-group qty-group" id="modalQtyGroup">
                    <label class="option-label">Quantité</label>
                    <div class="qty-stepper">
                        <button type="button" class="qty-step-btn" id="modalQtyMinus" aria-label="Diminuer la quantité">−</button>
                        <span class="qty-step-value" id="modalQtyValue">1</span>
                        <button type="button" class="qty-step-btn" id="modalQtyPlus" aria-label="Augmenter la quantité">+</button>
                    </div>
                </div>
                <div class="product-total" id="modalTotal"></div>
            </div>

            <!-- Recommandé + sous-catégories (style Temu) -->
            <div class="recommendations" id="modalRecommendations">
                <div class="rec-tabs" id="modalRecTabs" role="tablist">
                    <button type="button" class="rec-tab active" data-tab="recommended" role="tab" aria-selected="true">Recommandé</button>
                </div>
                <div class="rec-carousel" id="modalRecCarousel" role="tabpanel"></div>
            </div>
        </div>
        <div class="product-modal-footer">
            <button class="btn-secondary" id="directOrderBtn">Commander WhatsApp</button>
            <button class="btn-primary" id="addToCartStickyBtn">Ajouter au panier</button>
        </div>
    </div>

    <!-- Cart Panel -->
    <div class="cart-panel" id="cartPanel">
        <div class="cart-panel-header">
            <h2>Panier</h2>
            <button class="cart-close-btn" id="cartCloseBtn" aria-label="Fermer le panier">✕</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total</span>
                <span id="cartTotal">0 FCFA</span>
            </div>
            <button class="btn-primary checkout-btn" id="checkoutBtn" disabled>Commander</button>
        </div>
    </div>
    <div class="cart-overlay" id="cartOverlay"></div>

    <!-- Order Modal -->
    <div class="order-modal-overlay" id="orderModalOverlay">
        <div class="order-modal">
            <h2>Finaliser la commande</h2>
            <div id="orderSummary"></div>
            <label for="customerName">Votre nom</label>
            <input type="text" id="customerName" placeholder="Nom complet" autocomplete="name">
            <div class="order-modal-actions">
                <button class="btn-secondary" id="orderCancelBtn">Annuler</button>
                <button class="btn-primary" id="orderConfirmBtn">Envoyer sur WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-view="catalogue" aria-label="Catalogue">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"></path></svg>
            <span>Catalogue</span>
        </button>
        <button class="nav-item" data-view="search" aria-label="Recherche">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <span>Recherche</span>
        </button>
        <button class="nav-item" data-view="favorites" aria-label="Favoris">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
            <span>Favoris</span>
            <span class="nav-badge" id="navFavBadge" style="display:none;">0</span>
        </button>
        <button class="nav-item" data-view="cart" aria-label="Panier">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"></path></svg>
            <span>Panier</span>
            <span class="nav-badge" id="navCartBadge" style="display:none;">0</span>
        </button>
    </nav>

    <script type="module" src="/src/js/main.js"></script>
</body>
</html>
