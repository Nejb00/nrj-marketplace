name: NRJ Mission Control Evidence Writer — Locked Canary

on:
  workflow_dispatch:
    inputs:
      confirm_write:
        description: Explicitly arm the one locked canary (environment approval is still required)
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nrj-mission-control-notion-evidence-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    name: One locked Mission Register canary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: mission-control-notion-evidence-write
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject non-main revisions
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::This canary must execute from the reviewed main branch."
            exit 1
          fi

      - name: Checkout reviewed main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Require explicit confirmation and dedicated credential
        shell: bash
        env:
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
          NOTION_WRITE_TOKEN: ${{ secrets.NRJ_NOTION_EVIDENCE_WRITE_TOKEN }}
        run: |
          if [[ "$CONFIRM_WRITE" != "YES" ]]; then
            echo "::error::Canary confirmation was not YES; no API request was made."
            exit 1
          fi
          if [[ -z "$NOTION_WRITE_TOKEN" ]]; then
            echo "::error::The protected environment has no NRJ_NOTION_EVIDENCE_WRITE_TOKEN; no API request was made."
            exit 1
          fi

      - name: Run the identity-locked canary once
        shell: bash
        env:
          NRJ_NOTION_EVIDENCE_WRITE_TOKEN: ${{ secrets.NRJ_NOTION_EVIDENCE_WRITE_TOKEN }}
          NRJ_EVIDENCE_CANARY_CONFIRM: ${{ inputs.confirm_write }}
          NRJ_EVIDENCE_CANARY_OUTPUT_DIR: mission-control-evidence-canary
          NOTION_DATA_SOURCE_ID: de2fc4d0-3150-4811-acc0-80ce02e2c619
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/mission-control/evidence_writer_canary.py

      - name: Publish redacted result artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nrj-mission-control-evidence-canary-${{ github.run_id }}
          path: mission-control-evidence-canary/
          if-no-files-found: ignore
          retention-days: 14
