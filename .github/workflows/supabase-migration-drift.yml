# Supabase Migration Drift — surveillance Repository ↔ Supabase
# Cette sonde est lecture seule. Elle n'effectue aucune migration ni réparation.

name: Supabase Migration Drift

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Migration history audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v7

      - name: Vérifier la configuration
        id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Audit distant non activé : SUPABASE_ACCESS_TOKEN absent."
            exit 0
          fi

          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Audit distant non activé : variable SUPABASE_PROJECT_REF absente."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Interroger l'historique Supabase distant
        if: steps.config.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Accept: application/json" "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/migrations" > /tmp/remote-migrations.json

      - name: Comparer Repository ↔ Supabase
        if: steps.config.outputs.enabled == 'true'
        run: node scripts/migration-drift.mjs --remote-json /tmp/remote-migrations.json

      - name: Résumé de configuration
        if: steps.config.outputs.enabled != 'true'
        run: |
          echo "Migration history audit is installed but waiting for SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF."
