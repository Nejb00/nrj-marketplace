name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag GitHub à publier, par ex. v1.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Déterminer le tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v*) ;;
            *)
              echo "Le tag doit commencer par v (ex: v1.2.0)."
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Vérifier le tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git rev-parse "$TAG^{commit}" >/dev/null

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG"             --repo "${{ github.repository }}"             --title "$TAG"             --generate-notes
