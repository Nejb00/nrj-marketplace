name: Self-Healing Repair Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Self-Healing PR number to verify"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: self-healing-repair-verification-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repair Verification
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.head.ref, 'self-healing')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Self-Healing PR contract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test -n "${HEAD_REF}"
          if [[ ! "${HEAD_REF}" =~ self-healing ]]; then
            echo "PR non issue du circuit Self-Healing."
            exit 1
          fi
          grep -Eiq 'self-healing|repair|réparation' <<< "${PR_TITLE}
${PR_BODY}" || {
            echo "Contrat Self-Healing absent de la PR."
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build and smoke test
        run: |
          npm run build
          npm run test:smoke

      - name: Publish verification decision
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 🛡️ Self-Healing Repair Verification"
            echo ""
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "### ✅ Repair Verified"
              echo ""
              echo "Build, tests and smoke test passed."
            else
              echo "### ❌ Repair Rejected"
              echo ""
              echo "Au moins une vérification déterministe a échoué."
            fi
            echo ""
            echo "> Cette vérification n'autorise jamais un merge automatique."
          } >> "${GITHUB_STEP_SUMMARY}"
