name: NRJ Mission Control Evidence Writer Preview (Dry Run Only)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: Exact Mission Alias, for example NRJ-OPS-004
        required: true
        type: string
      pr_number:
        description: Exact merged pull-request number to inspect
        required: true
        type: number
      expected_head_sha:
        description: Full 40-character PR head SHA from a reviewed dry-run report
        required: true
        type: string
      expected_page_id:
        description: Exact Notion page UUID from a reviewed dry-run report
        required: true
        type: string
      expected_notion_last_edited_time:
        description: Exact Notion last_edited_time from the reviewed dry-run report
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    name: Validate evidence and prepare a non-writing preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    env:
      NRJ_NOTION_READ_TOKEN: ${{ secrets.NRJ_NOTION_READ_TOKEN }}
      NOTION_DATA_SOURCE_ID: de2fc4d0-3150-4811-acc0-80ce02e2c619
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Reject non-main workflow revisions
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::This workflow must execute from the reviewed main branch."
          exit 1

      - name: Checkout reviewed main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Require the existing read-only Notion credential
        shell: bash
        run: |
          if [[ -z "$NRJ_NOTION_READ_TOKEN" ]]; then
            echo "::error::NRJ_NOTION_READ_TOKEN is missing. No API request was made."
            exit 1
          fi

      - name: Validate evidence and write local preview files only
        shell: bash
        env:
          MISSION_ALIAS: ${{ inputs.alias }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_PAGE_ID: ${{ inputs.expected_page_id }}
          EXPECTED_NOTION_LAST_EDITED_TIME: ${{ inputs.expected_notion_last_edited_time }}
        run: |
          python scripts/mission-control/evidence_writer_preview.py \
            --alias "$MISSION_ALIAS" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-page-id "$EXPECTED_PAGE_ID" \
            --expected-notion-last-edited-time "$EXPECTED_NOTION_LAST_EDITED_TIME" \
            --output-dir mission-control-evidence-preview

      - name: Publish redacted preview artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nrj-mission-control-evidence-preview-${{ github.run_id }}
          path: mission-control-evidence-preview/
          if-no-files-found: ignore
          retention-days: 14
