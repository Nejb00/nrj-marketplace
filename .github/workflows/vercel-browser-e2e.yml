name: Vercel Browser E2E

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL Vercel à tester"
        required: false
        default: "https://nrj-marketplace.vercel.app"
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-browser-e2e
  cancel-in-progress: true

jobs:
  browser:
    name: Vercel Browser E2E
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment.environment == 'Production' ||
          github.event.deployment.environment == 'production' ||
          github.event.deployment.environment == 'Preview' ||
          github.event.deployment.environment == 'preview'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      E2E_BASE_URL: >-
        ${{
          github.event_name == 'workflow_dispatch'
          && inputs.base_url
          || github.event.deployment_status.environment_url
          || github.event.deployment_status.target_url
          || 'https://nrj-marketplace.vercel.app'
        }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Installation des dépendances du projet
        run: npm ci

      - name: Installation de Playwright
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.63.0

      - name: Installation de Chromium
        run: npx playwright install --with-deps chromium

      - name: Vérification navigateur
        run: npx playwright test tests/e2e/production.spec.mjs --reporter=list

      - name: Publier les rapports Playwright
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
