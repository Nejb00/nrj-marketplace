# CI — vérification automatique du code
# Chaque PR vers main (et chaque push sur main) doit passer les contrôles techniques.
# Node 22 est utilisé car les dépendances Supabase actuelles exigent Node >=22.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Principe de moindre privilège : la CI ne fait que lire le dépôt.
permissions:
  contents: read

# Une seule exécution active par branche/PR.
# Une nouvelle mise à jour rend la précédente inutile.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Contrôle syntaxique JavaScript
        run: npm run check:syntax

      - name: Tests unitaires
        run: npm test

      - name: Contrats métier déterministes
        run: npm run check:business

      - name: Build de production
        run: npm run build

      - name: Smoke test du build servi
        run: npm run test:smoke

      - name: Vérification du livrable
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ECHEC : dist/index.html manquant — le build n'a rien produit"
            exit 1
          fi
          if [ ! -d dist/assets ]; then
            echo "ECHEC : dist/assets manquant — les bundles JS/CSS absents"
            exit 1
          fi
          echo "Build OK — dist généré avec ses assets"
