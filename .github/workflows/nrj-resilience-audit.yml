name: NRJ Resilience Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nrj-resilience-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resilience:
    name: Self-Healing resilience matrix
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Self-Healing guard
        run: npm run check:self-healing-guard

      - name: Recovery guard
        run: npm run check:recovery-guard

      - name: Incident history
        run: npm run check:incident-history

      - name: Cross-system correlation
        run: npm run check:correlation
