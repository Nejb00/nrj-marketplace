name: NRJ Mission Control Reconciler Tests

on:
  push:
    branches:
      - feat/mission-control-readonly-reconciler-2026-10-20
      - feat/mission-control-evidence-writer-2026-10-21
      - feat/mission-control-evidence-writer-canary-2026-10-22
    paths:
      - scripts/mission-control/**
      - tests/mission-control/**
      - .github/workflows/mission-control-reconcile.yml
      - .github/workflows/mission-control-evidence-writer-preview.yml
      - .github/workflows/mission-control-evidence-writer-canary.yml
      - .github/workflows/mission-control-reconcile-tests.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/mission-control/**
      - tests/mission-control/**
      - .github/workflows/mission-control-reconcile.yml
      - .github/workflows/mission-control-evidence-writer-preview.yml
      - .github/workflows/mission-control-evidence-writer-canary.yml
      - .github/workflows/mission-control-reconcile-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Python tests and workflow safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: |
          python -m py_compile scripts/mission-control/reconcile.py scripts/mission-control/evidence_writer_preview.py scripts/mission-control/evidence_writer_canary.py tests/mission-control/test_reconcile.py tests/mission-control/test_evidence_writer_preview.py tests/mission-control/test_evidence_writer_canary.py

      - name: Run deterministic tests (no network, no secrets)
        run: python -m unittest discover -s tests/mission-control -v

      - name: Install YAML parser for workflow guard
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate manual workflow stays read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(".github/workflows/mission-control-reconcile.yml")
          workflow = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          triggers = workflow.get("on", {})
          assert set(triggers) == {"workflow_dispatch"}, f"Unexpected triggers: {sorted(triggers)}"
          permissions = workflow.get("permissions", {})
          assert permissions.get("contents") == "read", "contents must remain read-only"
          assert permissions.get("checks") == "read", "checks must remain read-only"
          assert permissions.get("pull-requests") == "read", "pull requests must remain read-only"
          assert "schedule" not in triggers, "Scheduled execution is not approved"
          print("Workflow syntax and read-only trigger/permissions checks passed.")

          writer_path = Path(".github/workflows/mission-control-evidence-writer-preview.yml")
          writer_text = writer_path.read_text(encoding="utf-8")
          writer_workflow = yaml.load(writer_text, Loader=yaml.BaseLoader)
          writer_triggers = writer_workflow.get("on", {})
          assert set(writer_triggers) == {"workflow_dispatch"}, f"Unexpected writer preview triggers: {sorted(writer_triggers)}"
          writer_permissions = writer_workflow.get("permissions", {})
          assert writer_permissions.get("contents") == "read", "writer preview contents must remain read-only"
          assert writer_permissions.get("pull-requests") == "read", "writer preview pull requests must remain read-only"
          assert "NRJ_NOTION_EVIDENCE_WRITE_TOKEN" not in writer_text, "preview workflow must not accept a write token"
          assert "persist-credentials: false" in writer_text, "checkout credentials must not persist"
          assert "github.ref != 'refs/heads/main'" in writer_text, "workflow must reject non-main execution"
          print("Evidence preview workflow parsed and confirmed manual/main/read-only/no-write-token.")

          canary_path = Path(".github/workflows/mission-control-evidence-writer-canary.yml")
          canary_text = canary_path.read_text(encoding="utf-8")
          canary_workflow = yaml.load(canary_text, Loader=yaml.BaseLoader)
          canary_triggers = canary_workflow.get("on", {})
          assert set(canary_triggers) == {"workflow_dispatch"}, f"Unexpected canary triggers: {sorted(canary_triggers)}"
          canary_permissions = canary_workflow.get("permissions", {})
          assert canary_permissions.get("contents") == "read", "canary contents must remain read-only"
          assert canary_permissions.get("pull-requests") == "read", "canary pull requests must remain read-only"
          canary_job = canary_workflow["jobs"]["canary"]
          assert canary_job.get("if") == "github.ref == 'refs/heads/main'", "canary must only run from main"
          assert canary_job.get("environment", {}).get("name") == "mission-control-notion-evidence-write", "canary must use its dedicated protected environment"
          canary_steps = canary_job.get("steps", [])
          write_step = next(step for step in canary_steps if step.get("name") == "Run the identity-locked canary once")
          guard_step = next(step for step in canary_steps if step.get("name") == "Require explicit confirmation and dedicated credential")
          expected_secret_ref = "$" + "{{ secrets.NRJ_NOTION_EVIDENCE_WRITE_TOKEN }}"
          assert write_step.get("env", {}).get("NRJ_NOTION_EVIDENCE_WRITE_TOKEN") == expected_secret_ref, "canary must use a separate write token"
          assert "NRJ_NOTION_EVIDENCE_WRITE_TOKEN" not in canary_job.get("env", {}), "write token must not be exposed at whole-job scope"
          assert guard_step.get("env", {}).get("NOTION_WRITE_TOKEN") == expected_secret_ref, "guard may only check credential presence"
          assert "persist-credentials: false" in canary_text, "canary checkout credentials must not persist"
          assert "confirm_write" in canary_text and "default: NO" in canary_text, "canary must be opt-in by default"
          assert "contents: write" not in canary_text and "pull-requests: write" not in canary_text, "canary GitHub permissions must remain read-only"
          print("Canary workflow parsed: manual, main-only, locked environment, separate token, read-only GitHub permissions.")
          PY
