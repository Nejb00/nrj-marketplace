name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "11 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Deterministic security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installation des dépendances
        run: npm ci

      - name: Audit sécurité déterministe
        run: node scripts/security-audit-repo.mjs
