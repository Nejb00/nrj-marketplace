name: Self-Healing

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue incident à traiter'
        required: true
        type: number

permissions:
  actions: write
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: self-healing
  cancel-in-progress: false

jobs:
  self-heal:
    name: Controlled self-healing
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'incident')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Evaluate incident and apply known recipe
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue.number;

            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('Numéro d’issue invalide.');
              return;
            }

            const issue = (await github.rest.issues.get({
              owner, repo, issue_number: issueNumber
            })).data;

            const sourceAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR', 'BOT']);
            const sourceAssociation = issue.user?.type === 'Bot'
              ? 'BOT'
              : (issue.author_association || 'NONE');
            const isIncident = issue.labels?.some((label) => {
              const name = typeof label === 'string' ? label : label.name;
              return name === 'incident';
            });
            const isGuardIncident = isIncident &&
              sourceAssociations.has(sourceAssociation) &&
              issue.title?.startsWith('🚨 Incident — ');

            if (!isGuardIncident) {
              core.info('Issue non incidente provenant de Incident Guard : aucune action.');
              return;
            }

            const retryMarker = '<!-- nrj-self-healing-retry -->';
            const repairMarker = '<!-- nrj-self-healing-repair -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            );

            if (comments.some((comment) => comment.body?.includes(repairMarker))) {
              core.info('Une réparation automatique a déjà été tentée pour cette issue.');
              return;
            }

            const runMatch = issue.body?.match(
              /Run:\s*https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/actions\/runs\/(\d+)/
            );

            if (!runMatch) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: [
                  retryMarker,
                  '## 🤖 Self-Healing',
                  '',
                  '⚠️ Aucun run source exploitable n’a été trouvé.',
                  'Aucune réparation automatique effectuée.'
                ].join('\n')
              });
              return;
            }

            const runId = Number(runMatch[1]);
            const run = (await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: runId
            })).data;

            const allowedWorkflows = new Set([
              'CI',
              'CodeQL',
              'Dependency Review',
              'Deployment Safety Net',
              'Vercel Browser E2E',
            ]);

            const recentFailure =
              run.head_branch === 'main' &&
              run.conclusion === 'failure' &&
              allowedWorkflows.has(run.name) &&
              Date.now() - new Date(run.updated_at).getTime() <= 24 * 60 * 60 * 1000;

            if (!recentFailure) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: [
                  retryMarker,
                  '## 🤖 Self-Healing',
                  '',
                  '🛑 Auto-réparation refusée par les garde-fous.',
                  '',
                  '- Workflow : **' + run.name + '**',
                  '- Branche : **' + (run.head_branch || '—') + '**',
                  '- Conclusion : **' + (run.conclusion || run.status) + '**',
                  '',
                  'Le run doit être récent, en échec, provenir de main et appartenir à la liste autorisée.'
                ].join('\n')
              });
              return;
            }

            const jobs = (await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: runId, per_page: 100
            })).data.jobs || [];
            const failedJobs = jobs.filter((job) => job.conclusion === 'failure');
            const logTexts = [];

            for (const job of failedJobs.slice(0, 3)) {
              try {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
                  { owner, repo, job_id: job.id }
                );
                logTexts.push(typeof response.data === 'string' ? response.data : String(response.data || ''));
              } catch (error) {
                core.warning('Logs indisponibles pour le job ' + job.id + ': ' + error.message);
              }
            }

            const recipesResponse = await github.rest.repos.getContent({
              owner, repo, path: '.github/self-healing-recipes.json', ref: 'main'
            });
            const recipesFile = recipesResponse.data;
            if (Array.isArray(recipesFile) || !recipesFile.content) {
              throw new Error('Catalogue de recettes indisponible.');
            }
            const recipes = JSON.parse(Buffer.from(recipesFile.content, recipesFile.encoding || 'base64').toString('utf8'));
            const recipe = (recipes.recipes || []).find((candidate) => {
              const enabledOk = candidate.enabled !== false;
              const ageOk = Date.now() - new Date(run.updated_at).getTime() <=
                (Number(candidate.max_age_hours || 24) * 60 * 60 * 1000);
              const workflowOk = candidate.workflow === run.name;
              const signatureOk = (candidate.signatures || []).some((signature) =>
                logTexts.some((log) => log.includes(signature))
              );
              return enabledOk && ageOk && workflowOk && signatureOk;
            });

            if (!recipe) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: [
                  repairMarker,
                  '## 🤖 Self-Healing V2',
                  '',
                  '🔎 Aucun correctif automatique connu ne correspond à cet incident.',
                  'Aucune modification n’a été effectuée.',
                  '',
                  'Le GitHub Operator doit prendre le relais pour le diagnostic et la création éventuelle d’une PR.'
                ].join('\n')
              });
              return;
            }

            const path = typeof recipe.path === 'string' ? recipe.path : '';
            const findText = typeof recipe.find === 'string' ? recipe.find : '';
            const replaceText = typeof recipe.replace === 'string' ? recipe.replace : '';
            const forbidden = /(^|\/)(?:\.env|secrets|credentials|id_rsa)(?:\.|\/|$)/i.test(path) ||
              /\.(?:pem|key|p12|pfx)$/i.test(path) ||
              path === '.github/workflows/self-healing.yml' ||
              path === '.github/self-healing-recipes.json';
            if (forbidden || !path || !findText || findText.length > 20000 || replaceText.length > 20000) {
              throw new Error('Recette bloquée par les garde-fous de chemin/taille.');
            }

            const target = (await github.rest.repos.getContent({
              owner, repo, path, ref: run.head_sha
            })).data;
            if (Array.isArray(target) || !target.content) throw new Error('Fichier cible inaccessible.');
            const current = Buffer.from(target.content, target.encoding || 'base64').toString('utf8');
            const occurrences = current.split(findText).length - 1;
            if (occurrences !== 1) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: [
                  repairMarker,
                  '## 🤖 Self-Healing V2',
                  '',
                  '🛑 La recette **' + recipe.id + '** a été reconnue mais son texte cible n’est pas dans l’état attendu.',
                  '',
                  '- Fichier : `' + path + '`',
                  '- Occurrences attendues : **1**',
                  '- Occurrences trouvées : **' + occurrences + '**',
                  '',
                  'Aucune modification effectuée.'
                ].join('\n')
              });
              return;
            }

            const next = current.replace(findText, replaceText);
            const branchName = 'operator/self-heal-' + runId + '-' + Date.now();
            await github.rest.git.createRef({
              owner, repo, ref: 'refs/heads/' + branchName, sha: run.head_sha
            });
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: branchName,
              message: recipe.commit_message || recipe.title || 'fix(automation): self-healing',
              content: Buffer.from(next, 'utf8').toString('base64'),
              sha: target.sha
            });

            const pr = (await github.rest.pulls.create({
              owner, repo, title: recipe.title || 'fix(automation): self-healing',
              head: branchName, base: 'main', draft: true,
              body: [
                '## 🤖 Self-Healing V2',
                '',
                'Recette connue appliquée automatiquement après correspondance exacte.',
                '',
                '- Recette : `' + recipe.id + '`',
                '- Incident : #' + issueNumber,
                '- Run source : #' + runId,
                '- Fichier : `' + path + '`',
                '- Branche : `' + branchName + '`',
                '- Occurrences remplacées : **1**',
                '',
                'Cette PR est en Draft et doit passer les checks avant toute validation humaine.'
              ].join('\n')
            })).data;

            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: [
                repairMarker,
                '## 🤖 Self-Healing V2',
                '',
                '🛠️ **Réparation automatique préparée.**',
                '',
                '- Recette : `' + recipe.id + '`',
                '- Branche : `' + branchName + '`',
                '- Draft PR : [#' + pr.number + '](' + pr.html_url + ')',
                '',
                '🛡️ Aucun changement direct n’a été appliqué à `main`.'
              ].join('\n')
            });

            core.info('Self-Healing V2: Draft PR #' + pr.number + ' créée.');