name: Incident Guard

on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Dependency Review
      - Deployment Safety Net
      - Vercel Browser E2E
      - Data Integrity
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: incident-guard-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  incident:
    name: Incident Guard
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout automation definitions
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Create or close incident
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const { analyzeIncident, renderIncidentIntelligence } = await import(
              'file://' + process.env.GITHUB_WORKSPACE + '/scripts/incident-intelligence.mjs'
            );

            const title = '🚨 Incident — ' + run.name + ' #' + run.run_number;
            const failureStates = new Set(['failure', 'timed_out', 'action_required']);

            const labels = ['incident', 'automation'];
            const definitions = {
              incident: { color: 'D93F0B', description: 'Automated repository incident' },
              automation: { color: '5319E7', description: 'Automation, CI/CD or repository tooling' },
            };

            for (const [name, meta] of Object.entries(definitions)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name, color: meta.color, description: meta.description,
                });
              }
            }

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: 'incident', per_page: 100 }
            );

            const existing = openIssues.find((issue) => issue.title === title);
            const summary = [
              'Workflow: ' + run.name,
              'Run: #' + run.run_number,
              'Commit: ' + run.head_sha,
              'Conclusion: ' + (run.conclusion || run.status),
              'Run: ' + run.html_url,
            ].join('\n');

            if (failureStates.has(run.conclusion)) {
              const jobs = (await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: run.id, per_page: 100 }
              )).filter((job) => job.conclusion === 'failure').slice(0, 3);

              const logTexts = [];
              for (const job of jobs) {
                try {
                  const response = await github.request(
                    'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
                    { owner, repo, job_id: job.id }
                  );
                  logTexts.push(
                    typeof response.data === 'string'
                      ? response.data
                      : String(response.data || '')
                  );
                } catch (error) {
                  core.warning('Logs indisponibles pour le job ' + job.id + ': ' + error.message);
                }
              }

              const recipesResponse = await github.rest.repos.getContent({
                owner, repo, path: '.github/self-healing-recipes.json', ref: 'main'
              });
              const recipesFile = recipesResponse.data;
              if (Array.isArray(recipesFile) || !recipesFile.content) {
                throw new Error('Catalogue de recettes indisponible.');
              }

              const recipes = JSON.parse(
                Buffer.from(
                  recipesFile.content,
                  recipesFile.encoding || 'base64'
                ).toString('utf8')
              );

              const intelligence = analyzeIncident({
                run,
                failedJobs: jobs,
                logTexts,
                recipes: recipes.recipes || [],
              });

              const intelligenceBlock = renderIncidentIntelligence(intelligence);
              const detail = [
                '## 🧠 Incident Intelligence',
                '',
                '| Champ | Valeur |',
                '|---|---|',
                '| Classification | **' + intelligence.classification + '** |',
                '| Workflow | `' + intelligence.workflow + '` |',
                '| Run | #' + intelligence.run_number + ' |',
                '| Commit | `' + intelligence.commit + '` |',
                '| Failed jobs | ' + intelligence.failed_jobs.length + ' |',
                '| Signature(s) | ' + (intelligence.signature_matches.length || 0) + ' |',
                '| Integrity signals | ' + (intelligence.integrity_matches.length || 0) + ' |',
                '| Recette candidate | ' + (intelligence.recipe_id ? '`' + intelligence.recipe_id + '`' : 'Aucune') + ' |',
                '| Action recommandée | **' + intelligence.recommended_action + '** |',
                '',
                'Les logs bruts ne sont pas enregistrés dans l’issue.',
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: [
                    'Nouvel échec détecté sur le même workflow.',
                    '',
                    summary,
                    '',
                    detail,
                    '',
                    intelligenceBlock,
                  ].join('\n')
                });
                core.info('Incident déjà ouvert: #' + existing.number);
                return;
              }

              const created = await github.rest.issues.create({
                owner, repo, title, body: [
                  '## Incident automatisé',
                  '',
                  'Un workflow critique a échoué sur `main`.',
                  '',
                  summary,
                  '',
                  detail,
                  '',
                  intelligenceBlock,
                  '',
                  'Cette issue sera automatiquement fermée lorsqu’un run réussi du même workflow sera détecté.',
                ].join('\n'),
                labels,
              });
              core.warning('Incident créé: #' + created.data.number);
              return;
            }

            if (run.conclusion === 'success' && existing) {
              const resolution = {
                schema_version: 1,
                event: 'resolved',
                workflow: run.name,
                resolution_run_id: run.id,
                resolution_run_number: run.run_number,
                resolution_commit: run.head_sha,
                resolution_status: 'success',
              };

              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: [
                  '✅ Le workflow est de nouveau vert.',
                  '',
                  'Run: ' + run.html_url,
                  '',
                  '## 🧠 Incident Intelligence — Résolution',
                  '',
                  '- Workflow : `' + run.name + '`',
                  '- Run de résolution : #' + run.run_number,
                  '- Commit : `' + run.head_sha + '`',
                  '- Statut : **resolved**',
                  '',
                  renderIncidentIntelligence(resolution),
                ].join('\n'),
              });

              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
              });
              core.info('Incident résolu et fermé: #' + existing.number);
            }
