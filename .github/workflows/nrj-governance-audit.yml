name: NRJ Governance Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nrj-governance-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Self-Healing governance matrix
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Contrats métier
        run: npm run check:business

      - name: Dérive migrations
        run: npm run check:migrations

      - name: Intégrité doublons/orphelins
        run: npm run check:integrity

      - name: Cohérence inter-systèmes et valeurs impossibles
        run: npm run check:cross

      - name: Sécurité déterministe
        run: npm run check:security

      - name: Intelligence des tests
        run: npm run check:test-intelligence

      - name: Audit paiement
        run: npm run check:payments

      - name: Matrice attaques paiement
        run: npm run check:payment-attacks

      - name: Santé des tests et flakiness
        run: npm run check:test-health

      - name: Test suite complète
        run: npm test

      - name: Résumé
        if: always()
        run: |
          {
            echo "## NRJ Governance Audit"
            echo ""
            echo "Toutes les couches déterministes ont été exécutées."
            echo "Aucune écriture de données métier n'est effectuée par ce workflow."
          } >> "$GITHUB_STEP_SUMMARY"
