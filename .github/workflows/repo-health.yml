name: Repo Health

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: repo-health
  cancel-in-progress: true

jobs:
  health:
    name: Repository Health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Vérification de la structure GitHub
        uses: actions/github-script@v9
        with:
          script: |
            const expectedWorkflows = new Set([
              "CI",
              "CodeQL",
              "Dependency Review",
              "PR Labels",
              "PR Quality",
              "Project Report",
              "Release",
              "Repo Health",
              "Deployment Safety Net",
              "Vercel Browser E2E",
              "Automation Dashboard",
              "Self-Healing",
            ]);

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const workflowNames = new Set(workflows.map((workflow) => workflow.name));
            const missingWorkflows = [...expectedWorkflows].filter(
              (name) => !workflowNames.has(name)
            );

            if (missingWorkflows.length) {
              core.setFailed(
                `Workflows attendus absents : ${missingWorkflows.join(", ")}`
              );
            } else {
              core.info(
                `Workflow check OK — ${expectedWorkflows.size} workflows attendus présents.`
              );
            }

            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });

            if (!branch.data.protected) {
              core.setFailed("La branche main n'est plus protégée.");
              return;
            }

            // Modèle depuis le 07/10 : NRJ Merge Gate = unique check requis de
            // main. Les contexts requis de la protection sont illisibles sans
            // droit admin (refusé au GITHUB_TOKEN) — on vérifie donc que la
            // gate vit : check run "NRJ Merge Gate" en succès sur le dernier
            // commit de main (la gate re-s'exécute via workflow_run quand la
            // CI de main tourne).
            const mainSha = branch.data.commit.sha;

            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: mainSha,
                per_page: 100,
              }
            );

            const gateOk = checkRuns.some(
              (run) =>
                run.name === "NRJ Merge Gate" &&
                run.conclusion === "success"
            );

            if (!gateOk) {
              core.setFailed(
                "NRJ Merge Gate absente du dernier commit de main (ou non verte)."
              );
            }

            core.summary
              .addHeading("Repository Health")
              .addTable([
                [
                  { data: "Contrôle", header: true },
                  { data: "Résultat", header: true },
                ],
                ["Workflows attendus", missingWorkflows.length ? "Échec" : "OK"],
                ["Protection de main", branch.data.protected ? "OK" : "Échec"],
                ["NRJ Merge Gate (commit main)", gateOk ? "OK" : "Échec"],
              ])
              .write();
