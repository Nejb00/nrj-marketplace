name: Deploy Supabase Edge Functions

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

# Le workflow ne déploie automatiquement qu'après une CI push sur main réussie.
# Le lancement manuel reste disponible comme voie de maintenance contrôlée.
permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy-payment-openpay:
    name: Deploy payment-openpay
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
          ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PROJECT_ID: "peojyqliwrtghomyukwn"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout de main uniquement
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 1

      - name: Vérifier le commit validé par CI
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          case "${VALIDATED_SHA:-}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]
              *) echo "::error::CI head_sha invalide"; exit 1 ;;
          esac
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$VALIDATED_SHA" ]; then
            echo "::error::Le main courant ne correspond plus au commit validé par CI. Aucun déploiement ne sera effectué."
            exit 1
          fi
          echo "Commit déployé validé par CI : $CURRENT_SHA"

      - name: Vérifier le secret de déploiement
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Le secret GitHub SUPABASE_ACCESS_TOKEN est absent. Ajoutez-le dans Settings > Secrets and variables > Actions avant de lancer le déploiement."
            exit 1
          fi
          echo "Secret de déploiement détecté."

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.119.0

      - name: Déployer payment-openpay via l'API Supabase
        run: |
          set -euo pipefail
          supabase functions deploy payment-openpay \
            --project-ref "$PROJECT_ID" \
            --use-api

      - name: Résumé du déploiement
        if: always()
        run: |
          {
            echo "## Supabase Edge Function Deployment"
            echo ""
            echo "- Fonction : `payment-openpay`"
            echo "- Projet : `$PROJECT_ID`"
            echo "- Mode : API Supabase"
            echo "- JWT : conservé via `supabase/config.toml`"
            echo "- Déclencheur : CI `main` réussie ou lancement manuel"
          } >> "$GITHUB_STEP_SUMMARY"
