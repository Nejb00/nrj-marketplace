name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/payment-openpay/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-edge-functions.yml"
  workflow_dispatch:

# Le workflow lit le dépôt et déploie uniquement la fonction explicitement ciblée.
permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy-payment-openpay:
    name: Deploy payment-openpay
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PROJECT_ID: "peojyqliwrtghomyukwn"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout de main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Vérifier le secret de déploiement
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Le secret GitHub SUPABASE_ACCESS_TOKEN est absent. Ajoutez-le dans Settings > Secrets and variables > Actions avant de lancer le déploiement."
            exit 1
          fi
          echo "Secret de déploiement détecté."

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer payment-openpay via l'API Supabase
        run: |
          set -euo pipefail
          supabase functions deploy payment-openpay \
            --project-ref "$PROJECT_ID" \
            --use-api

      - name: Résumé du déploiement
        if: always()
        run: |
          {
            echo "## Supabase Edge Function Deployment"
            echo ""
            echo "- Fonction : `payment-openpay`"
            echo "- Projet : `$PROJECT_ID`"
            echo "- Mode : API Supabase"
            echo "- JWT : conservé via `supabase/config.toml`"
          } >> "$GITHUB_STEP_SUMMARY"
