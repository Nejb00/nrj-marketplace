<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.svg">
    <title>Admin • NRJ Marketplace</title>
    <link rel="preconnect" href="https://peojyqliwrtghomyukwn.supabase.co">
    <link rel="dns-prefetch" href="//peojyqliwrtghomyukwn.supabase.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-mode">
    <div class="admin-dedicated">
        <div class="admin-header">
            <button id="backToCatalogueBtn" class="btn-back">← Retour au catalogue</button>
            <h1>🛠️ Panneau Admin</h1>
            <button class="logout-btn visible" id="logoutBtn" aria-label="Se déconnecter" title="Se déconnecter" style="display:none;">🚪</button>
        </div>

        <!-- Formulaire de connexion, visible tant qu'aucune session admin n'est active -->
        <div class="admin-panel" id="loginPanel" style="display:block;">
            <h2 style="text-align:center;margin-bottom:1rem;">🔐 Connexion admin</h2>
            <div class="form-group"><label>📧 Email</label><input type="email" id="adminEmail" required></div>
            <div class="form-group"><label>🔑 Mot de passe</label><input type="password" id="adminPassword" required></div>
            <button class="btn btn-primary" id="adminLoginBtn" style="width:100%;background:var(--primary);color:white;border:none;padding:0.8rem;border-radius:50px;font-weight:700;cursor:pointer;">Se connecter</button>
            <div id="adminError" style="color:#fca5a5;text-align:center;font-size:0.8rem;margin-top:0.5rem;"></div>
        </div>

        <!-- Panneau produits, affiché une fois connecté -->
        <div class="admin-panel" id="adminPanel">
            <!-- Tableau de bord (rempli par renderAdminStats) -->
            <section id="adminStats"></section>

            <h2 style="margin-bottom:1rem;color:var(--primary);">Ajouter un nouveau produit</h2>
            <div class="form-group"><label>Nom</label><input type="text" id="adminName" placeholder="Ex: Écouteurs Pro"></div>

            <div class="form-group">
                <label>Catégorie</label>
                <select id="adminCategory">
                    <option value="">— Choisir une catégorie —</option>
                </select>
            </div>
            <div class="form-group">
                <label>Sous-catégorie</label>
                <select id="adminSubcategory" disabled>
                    <option value="">— Choisir d'abord une catégorie —</option>
                </select>
            </div>

            <div class="form-group"><label>Prix (FCFA)</label><input type="number" id="adminPrice" placeholder="8500"></div>
            <div class="form-group"><label>Image 1 (URL)</label><input type="url" id="adminImage" placeholder="Lien de l'image 1"></div>
            <div class="form-group"><label>Image 2 (URL)</label><input type="url" id="adminImage2" placeholder="Lien de l'image 2"></div>
            <div class="form-group"><label>Image 3 (URL)</label><input type="url" id="adminImage3" placeholder="Lien de l'image 3"></div>
            <div class="form-group"><label>Image 4 (URL)</label><input type="url" id="adminImage4" placeholder="Lien de l'image 4"></div>
            <div class="form-group"><label>Image 5 (URL)</label><input type="url" id="adminImage5" placeholder="Lien de l'image 5"></div>
            <div class="form-group"><label>Image 6 (URL)</label><input type="url" id="adminImage6" placeholder="Lien de l'image 6"></div>
            <div class="form-group"><label>Tailles (séparées par des virgules)</label><input type="text" id="adminTailles" placeholder="M, L, XL"></div>
            <div class="form-group"><label>Couleurs (séparées par des virgules)</label><input type="text" id="adminCouleurs" placeholder="Noir, Blanc, Kaki"></div>
            <div class="form-group"><label>Quantité minimale (MOQ)</label><input type="number" id="adminMoq" placeholder="1" min="1" value="1"></div>
            <div class="form-group"><label>Description</label><input type="text" id="adminDesc" placeholder="Description courte"></div>
            <button class="btn btn-primary" id="addProductBtn" style="width:100%;background:var(--primary);color:white;border:none;padding:0.8rem;border-radius:50px;font-weight:700;cursor:pointer;">Ajouter au catalogue</button>
            <h3 style="margin-top:2rem; font-size:1rem;">Produits en ligne</h3>
            <ul class="admin-products-list" id="adminProductsList"></ul>
        </div>
    </div>

    <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

    <script type="module" src="/src/js/admin-main.js"></script>
</body>
</html>
